# Conda environment for stylegan2-audio (see USAGE.md §1).
# One env for both machines:
#   - RTX 5070 Ti laptop (Blackwell, sm_120)  -> needs torch >= 2.7 cu128 wheels
#   - AWS g6/g6e (L4/L40S, Ada, sm_89)        -> same wheels work
# The op/ CUDA extensions JIT-compile at first run: ninja is in the env,
# but a host C++ compiler (MSVC on Windows, gcc on Linux) must be installed
# system-side. On Blackwell set TORCH_CUDA_ARCH_LIST="12.0" if the build fails.
name: stylegan2-audio
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - ninja                    # JIT build of op/ CUDA extensions
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch>=2.7
      - torchvision          # train.py transforms / save_image
      - torchaudio           # audio I/O + resampling in data prep (NOT mel extraction)
      - numpy
      - scipy
      - pillow
      - tqdm
      - lmdb                 # image-pipeline smoke test only (prepare_data.py / dataset.py)
      - librosa              # dependency of BigVGAN's meldataset (mel filterbank); never used directly for extraction
      - soundfile
      - huggingface_hub      # pull nvidia/bigvgan_v2_22khz_80band_fmax8k_256x
      - matplotlib           # mel-canvas visual checks
      - pytest               # unit_test/ suite
      - wandb                # optional: train.py --wandb
# BigVGAN is not on PyPI and is NOT cloned: its meldataset.py/env.py are vendored
# verbatim at audio/ (pinned commit in audio/contract.py::BIGVGAN_COMMIT) and its
# inference code at audio/bigvgan/; weights come from huggingface_hub at first
# vocode (BigVGAN.from_pretrained). Its get_mel_spectrogram is the ONLY allowed
# mel extractor (GAN_TRAINING_SPEC.md §2).
